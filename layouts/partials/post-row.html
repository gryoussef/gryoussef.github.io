<article class="post-row">
  <div class="post-details"><div class="post-meta"><span>{{ .ReadingTime }} min read</span></div><h3><a href="{{ .RelPermalink }}">{{ .Title }} <span class="post-arrow" aria-hidden="true">↗</span></a></h3><p>{{ .Description | default (.Summary | plainify | truncate 150) }}</p><div class="tags">{{ range .GetTerms "tags" }}<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}</div></div>
</article>

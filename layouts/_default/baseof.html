<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ .Description | default .Site.Params.description }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ .Description | default .Site.Params.description }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:image" content="{{ .Site.Params.avatarURL | absURL }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f7f6f2">
  <link rel="icon" href="{{ "images/favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}?v={{ readFile "static/css/site.css" | sha256 }}">
  {{ range .AlternativeOutputFormats }}<link rel="alternate" type="{{ .MediaType.Type }}" href="{{ .Permalink }}" title="{{ $.Site.Title }}">{{ end }}
  <script src="{{ "js/theme.js" | relURL }}?v={{ readFile "static/js/theme.js" | sha256 }}"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}" aria-label="Youssef El Jirari home"><span class="brand-name">eljirari<span class="brand-suffix">.me</span></span></a>
    <nav aria-label="Main navigation">
      <a href="{{ .Site.Home.RelPermalink }}" {{ if .IsHome }}aria-current="page"{{ end }}>Home</a>
      <a href="{{ "posts/" | relURL }}" {{ if eq .Section "posts" }}aria-current="page"{{ end }}>Writing</a>
      <a href="{{ "tags/" | relURL }}" {{ if eq .Data.Plural "tags" }}aria-current="page"{{ end }}>Topics</a>
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.5 13.2A8.7 8.7 0 0 1 10.8 3.5 8.8 8.8 0 1 0 20.5 13.2Z"/></svg></button>
    </nav>
  </header>
  <main id="main" class="wrap">{{ block "main" . }}{{ end }}</main>
  <footer class="site-footer wrap"><span>© {{ now.Year }} Youssef El Jirari</span><span>Always learning. Always building.</span><a href="{{ "index.xml" | relURL }}">RSS <span aria-hidden="true">↗</span></a></footer>
</body>
</html>
